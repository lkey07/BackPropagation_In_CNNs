[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-backprop-from-scratch"
version = "1.0.0"
description = "Inspectable CNN forward and backward passes implemented with NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
notebooks = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "tensorflow>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["notebooks"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
